<!DOCTYPE html>
<html>
<head>
    <title>Apexiums Management System – Register</title>
    <style>
        body { font-family: Arial; background: #f5fff5; }
        .box {
            width: 380px; margin: 80px auto; padding: 30px;
            background: #fff; border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: green; font-weight: bold; }
        input {
            width: 100%; padding: 10px; margin: 10px 0;
            border-radius: 5px; border: 1px solid #ccc;
        }
        button {
            width: 100%; padding: 10px;
            background: green; color: #fff;
            border: none; border-radius: 5px;
            font-size: 16px;
        }
        a { color: green; text-decoration: none; }
    </style>
</head>
<body>

<div class="box">
    <h2><b>Apexiums Management System</b></h2>

    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password1" placeholder="Password" required>
        <input type="password" name="password2" placeholder="Confirm Password" required>
        <button type="submit">Register</button>
    </form>

    <p><a href="{% url 'login' %}">Already have an account?</a></p>
</div>

</body>
</html>
