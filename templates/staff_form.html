<h2>{{ staff|default:"Add" }} Staff</h2>
<form method="post">
{% csrf_token %}
<input type="text" name="full_name" value="{{ staff.full_name }}" placeholder="Full Name" required><br>
<input type="email" name="email" value="{{ staff.email }}" placeholder="Email" required><br>
<input type="text" name="designation" value="{{ staff.designation }}" placeholder="Designation" required><br>
<input type="number" name="salary" value="{{ staff.salary }}" placeholder="Salary" required><br>
<button type="submit">Save</button>
</form>
