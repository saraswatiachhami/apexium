<h2>{{ course|default:"Add" }} Course</h2>
<form method="post">
{% csrf_token %}
<input type="text" name="name" placeholder="Course Name" value="{{ course.name }}" required><br>
<input type="text" name="duration" placeholder="Duration" value="{{ course.duration }}" required><br>
<input type="number" name="fee" placeholder="Fee" value="{{ course.fee }}" required><br>
<button type="submit">Save</button>
</form>
