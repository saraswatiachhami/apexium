{% extends 'base.html' %}
{% block content %}
<h2>Instructors</h2>

<a href="{% url 'instructor_add' %}">Add New Instructor</a>
<table border="1" cellpadding="5" cellspacing="0">
    <thead>
        <tr>
            <th>Full Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
    {% for instructor in instructors %}
        <tr>
            <td>{{ instructor.full_name }}</td>
            <td>{{ instructor.email }}</td>
            <td>{{ instructor.phone }}</td>
            <td>
                <a href="{% url 'instructor_edit' instructor.id %}">Edit</a> |
                <a href="{% url 'instructor_delete' instructor.id %}">Delete</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="4">No instructors found.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
