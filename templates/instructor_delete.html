{% extends 'base.html' %}
{% block content %}
<h2>Delete Instructor</h2>
<p>Are you sure you want to delete "{{ instructor.full_name }}"?</p>

<form method="post" action="{% url 'instructor_delete' instructor.id %}">
  {% csrf_token %}
  <button type="submit">Yes, Delete</button>
  <a href="{% url 'instructor_list' %}">Cancel</a>
</form>

{% endblock %}
